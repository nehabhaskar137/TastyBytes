<style>
    /* Background similar to Swiggy */
    .login-bg {
        background: url('https://source.unsplash.com/1600x900/?restaurant,food') no-repeat center center;
        background-size: cover;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
    }
    
    /* Background overlay to improve contrast */
    .login-bg::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.6);
    }
    
    /* Login container */
    .login-container {
        position: relative;
        z-index: 2;
        width: 100%;
        max-width: 400px; /* Prevents stretching */
    }
    
    /* Login card */
    .login-card {
        background: white;
        border-radius: 12px;
        box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.3);
        padding: 25px;
    }
    
    /* Login title */
    .login-title {
        font-weight: bold;
        color: #ff6600;
        text-align: center;
        margin-bottom: 20px;
    }
    
    /* Form styling */
    .login-input {
        border-radius: 5px;
        border: 1px solid #ff6600;
        padding: 10px;
        font-size: 16px;
    }
    
    /* Label styling */
    .login-label {
        font-weight: bold;
        color: #333;
    }
    
    /* Login button */
    .login-btn {
        background-color: #ff6600;
        color: white;
        font-weight: bold;
        border-radius: 5px;
        padding: 12px;
        width: 100%;
        border: none;
        transition: 0.3s;
    }
    
    .login-btn:hover {
        background-color: #e65c00;
    }
    
    /* Login link */
    .login-link {
        color: #ff6600;
        font-weight: bold;
        text-decoration: none;
    }
    
    .login-link:hover {
        text-decoration: underline;
    }
    </style>
    
    <div class="login-bg">
        <div class="login-container">
            <div class="card login-card">
                <div class="card-body">
                    <h2 class="login-title">Welcome Back!</h2>
                    <form [formGroup]="loginForm" (ngSubmit)="login()" class="p-3">
                        <div class="form-group">
                            <label for="username" class="login-label">Username:</label>
                            <input type="text" id="username" class="form-control login-input" formControlName="username" required>
                            <div *ngIf="username?.invalid && (username?.dirty || username?.touched)" class="text-danger">
                                <small>Username is required.</small>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="password" class="login-label">Password:</label>
                            <input type="password" id="password" class="form-control login-input" formControlName="password" required>
                            <div *ngIf="password?.invalid && (password?.dirty || password?.touched)" class="text-danger">
                                <small>Password is required.</small>
                            </div>
                        </div>
                        <button type="submit" class="btn login-btn" [disabled]="loginForm.invalid">Login</button>
                    </form>
                    <div class="text-center mt-3">
                        <a routerLink="/register" class="login-link">Don't have an account? Register here</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
